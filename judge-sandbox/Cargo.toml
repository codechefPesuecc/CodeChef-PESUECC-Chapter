[package]
name = "judge-sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
nix = { version = "0.29", features = ["process", "resource", "sched", "mount", "signal", "time"] }
tokio = { version = "1.39", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tempfile = "3.10"
libc = "0.2"
seccompiler = "0.4"
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sandbox_bench"
harness = false
