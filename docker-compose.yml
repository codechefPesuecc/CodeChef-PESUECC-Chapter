# High-Performance Rust Judge Sandbox container service.
# The Next.js app and its SQLite database run natively on Node (npm run dev).
#
#   docker compose up -d               # start the judge sandbox
#   npm run dev                        # run the app on the host
#   curl localhost:3000/api/health     # verify app <-> db <-> judge
services:
  judge:
    build:
      context: ./judge-sandbox
      dockerfile: Dockerfile
    image: judge-sandbox:latest
    container_name: judge-server
    privileged: true
    init: true
    environment:
      - RUST_LOG=info
      - JUDGE_MODE=server
      - JUDGE_PORT=8080
      - JUDGE_MAX_QUEUE=128
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped