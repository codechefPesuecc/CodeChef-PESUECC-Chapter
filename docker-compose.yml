# High-Performance Akiro Rust Judge Sandbox container service.
# Standalone Repo: https://github.com/barunaniket/akiro
# The Next.js app and its SQLite database run natively on Node (npm run dev).
#
#   docker compose up -d               # start the akiro sandbox
#   npm run dev                        # run the app on the host
#   curl localhost:3000/api/health     # verify app <-> db <-> judge
services:
  judge:
    build:
      context: https://github.com/barunaniket/akiro.git#main
    image: akiro:latest
    container_name: akiro-server
    privileged: true
    init: true
    environment:
      - RUST_LOG=info
      - JUDGE_MODE=server
      - JUDGE_PORT=8080
      - JUDGE_MAX_QUEUE=128
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped